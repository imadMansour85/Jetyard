name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  go-integration:
    name: Go integration (nats-server 2.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # A service container can't take arguments, so start NATS by hand
      # with JetStream (-js) and the monitoring port (-m 8222).
      - name: Start nats-server
        run: docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.12 -js -m 8222
      - name: Wait for NATS
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8222/healthz && exit 0
            sleep 1
          done
          docker logs nats
          exit 1
      - name: Integration tests
        env:
          NATS_TEST_URL: nats://127.0.0.1:4222
          NATS_MONITOR_PORT: "8222"
        run: go test -tags integration -run Integration -count=1 ./...

  image:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Build static export (used by the Docker image)
        run: NEXT_OUTPUT=export npm run build

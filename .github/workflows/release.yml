name: Release

# Push a tag like v0.1.0 to publish ghcr.io/<owner>/<repo>:0.1.0, :0.1 and
# :latest (amd64 + arm64) and create the GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  packages: write # push to GHCR

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and build info
        id: vars
        run: |
          # GHCR names must be lowercase; the repository name may not be.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Pre-releases (v0.2.0-rc.1) don't move :latest.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Jetyard
            org.opencontainers.image.description=Self-hosted dashboard for NATS: streams, consumers, KV, accounts and users
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Write install notes
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<NOTES
          ## Install

          \`\`\`bash
          docker run -d -p 3000:3000 \\
            -e NATS_URL=nats://your-nats-host:4222 \\
            -e JWT_SECRET="\$(openssl rand -hex 32)" \\
            -v jetyard-data:/data \\
            ${IMAGE}:${TAG#v}
          \`\`\`

          Then open http://localhost:3000 and create the first admin. See docs/install.md for upgrades.
          NOTES

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
